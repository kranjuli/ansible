---
- name: Basic setup for Raspberry Pi
  hosts: all
  become: true
  gather_facts: true
  vars:
    upgrade_packages_clean_cache: true
    sudo_user: "kranjuli"
    sudo_user_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIO7CPfNf9BZJ+PUbsCCbTDD1UcEVwehs5RndBTJ43+U kranjuli@kranjuli-pi"
    docker_log_max_size: "10m"
    docker_log_max_files: "3"
  tasks:
    - name: OS information
      ansible.builtin.debug:
        msg: "OS: {{ ansible_distribution }} - {{ ansible_facts['lsb']['release'] }}"

    - name: Upgrade OS packages
      ansible.builtin.apt:
        autoclean: true
        dpkg_options: 'force-confold,force-confdef'
        upgrade: dist
        update_cache: true
        lock_timeout: 600
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      async: 900
      poll: 0
      register: _os_upgrade_job

    - name: Wait for upgrading of os packages to complete
      ansible.builtin.async_status:
        jid: "{{ _os_upgrade_job.ansible_job_id }}"
      register: _os_upgrade_status
      until: _os_upgrade_status.finished
      retries: 30
      delay: 30

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      register: _reboot_required_file

    - name: Reboot is required
      ansible.builtin.debug:
        msg: "A reboot is required to complete the OS upgrade. The host will be rebooted now."
      when: _reboot_required_file.stat.exists
    
    - name: The host is rebooted
      ansible.builtin.reboot:
      when: _reboot_required_file.stat.exists

    - name: No longer required dependencies are removed
      ansible.builtin.apt:
        autoremove: true
        clean: true
      # apt might be blocked by another installation (e.g. unattended upgrades) so we want lots of retries
      register: _results
      until: _results is not failed
      retries: 2
      delay: 30

    - name: Delete apt cache
      ansible.builtin.file:
        path: /var/cache/apt/archives
        state: absent
      when: upgrade_packages_clean_cache

    - name: Add sudo user on host
      ansible.builtin.user:
        name: "{{ sudo_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Add sudo user SSH public key
      ansible.builtin.authorized_key:
        user: "{{ sudo_user }}"
        state: present
        key: "{{ sudo_user_ssh_public_key }}"

    - name: Install prerequisites for Docker
      ansible.builtin.apt:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create Docker GPG keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.gpg
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository: 
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'armhf' }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Docker log rotation configuration
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "{{ docker_log_max_size }}",
              "max-file": "{{ docker_log_max_files }}"
            }
          }
      notify: Restart Docker service

    - name: Docker group - add sudo user to it
      ansible.builtin.user:
        name: "{{ sudo_user }}"
        groups: docker
        append: true

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

  handlers:
    - name: Restart Docker service
      ansible.builtin.service:
        name: docker
        state: restarted
